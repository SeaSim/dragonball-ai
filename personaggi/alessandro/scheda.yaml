note: >
  Namecciano originale, non un personaggio ufficiale.
  Pelle verde, due antenne, orecchie a punta.
  Vestiti: gi magenta-viola, obi bianco, mantello bianco, stivali bianchi
  (taglio da Namecciano classico / Junior). Turbante omesso per lasciare
  visibili chignon e antenne.
  Volto fotorealistico di Alessandro (capelli scuri raccolti, barba).
  Potenziamento = aura verde / forma potenziata, NON Super Saiyan biondo.
  Ignora il bambino e il cane.
